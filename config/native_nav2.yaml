/scan345/planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 5.0
    planner_plugins:
    - GridBased
    GridBased:
      plugin: control_center_navigation::ExactGoalSmacPlanner
      tolerance: 0.0
      use_final_approach_orientation: false
      downsample_costmap: false
      downsampling_factor: 1
      allow_unknown: false
      max_iterations: 1000000
      max_planning_time: 2.0
      smooth_path: true
      cost_travel_multiplier: 5.0
      use_quadratic_cost: true
/scan345/controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 15.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.0
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.5
    progress_checker_plugins:
    - progress_checker
    publish_zero_velocity: true
    goal_checker_plugins:
    - goal_checker
    controller_plugins:
    - FollowPath
    progress_checker:
      plugin: nav2_controller::PoseProgressChecker
      required_movement_radius: 0.05
      required_movement_angle: 0.1
      movement_time_allowance: 20.0
    goal_checker:
      plugin: scan345::ApproachGoalChecker
      xy_goal_tolerance: 0.05
      yaw_goal_tolerance: 0.05
      stateful: false
      trans_stopped_velocity: 0.015
      rot_stopped_velocity: 0.025
    FollowPath:
      plugin: scan345::ApproachMPPIController
      approach_max_distance: 3.0
      JointTrajectoryCritic:
        enabled: true
        position_weight: 24.0
        heading_weight: 9.0
        velocity_weight: 3.0
      time_steps: 40
      model_dt: 0.06666666666666667
      batch_size: 1600
      open_loop: false
      iteration_count: 1
      vx_std: 0.18
      vy_std: 0.08
      wz_std: 0.35
      vx_max: 0.45
      vx_min: -0.12
      vy_max: 0.12
      wz_max: 1.3
      ax_max: 0.6
      ax_min: -0.6
      ay_max: 0.3
      ay_min: -0.3
      az_max: 1.8
      temperature: 0.3
      gamma: 0.015
      motion_model: Omni
      visualize: false
      publish_optimal_trajectory: false
      regenerate_noises: false
      transform_tolerance: 0.2
      prune_distance: 1.7
      critics:
      - JointTrajectoryCritic
      - ConstraintCritic
      - CostCritic
      - ApproachGoalCritic
      - ApproachGoalAngleCritic
      - ApproachPathAlignCritic
      - ApproachPathFollowCritic
      - ApproachPathAngleCritic
      - ApproachPreferForwardCritic
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        near_collision_cost: 253
        critical_cost: 300.0
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 1.0
        trajectory_point_step: 2
      ApproachGoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 10.0
        threshold_to_consider: 1.3
      ApproachGoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.8
      ApproachPathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 10.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.8
        offset_from_furthest: 18
        use_path_orientations: false
      ApproachPathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 6.0
        offset_from_furthest: 5
        threshold_to_consider: 0.15
      ApproachPathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        offset_from_furthest: 4
        threshold_to_consider: 0.8
        max_angle_to_furthest: 0.9
        mode: 0
      ApproachPreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 6.0
        threshold_to_consider: 0.15
    odom_topic: /scan345/nav2_odom
    enable_stamped_cmd_vel: true
